services:
  api:
    build:
      context: ./api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      SERVICE_NAME: "Evergreen Quote API"
      MONGODB_URI: "mongodb://mongo:27017/evergreen"
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mongo-data:
